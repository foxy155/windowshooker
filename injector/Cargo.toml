[package]
name = "injector"
version = "0.1.0"
edition = "2021"

[dependencies]
ib-hook = { version = "0.2", features = ["inject-dll", "sysinfo"] }
eframe = "0.27"
egui = "0.27"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.37"
log = "0.4"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
egui_code_editor = "0.4.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"

